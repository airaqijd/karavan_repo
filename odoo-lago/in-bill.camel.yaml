- beans:
    - {}
- route:
    id: route-bill-in
    nodePrefixId: route-311
    trace: true
    from:
      id: in-bill
      uri: netty-http
      parameters:
        passphrase: manager
        protocol: http
        port: "8008"
        path: api/v1/bill/in
        host: 0.0.0.0
      steps:
        - unmarshal:
            id: unmarshal-de88
            json:
              id: json-ee18
              library: Jackson
        - log:
            id: log-fb84
            message: "received: ${body}"
            loggingLevel: INFO
        - bean:
            id: bean-b7dc
            ref: CustomBean
            method: process
            beanType: CustomBean
            scope: Singleton
        - process:
            id: process-315d
            ref: CustomProcessor
        - to:
            id: in-bill-redis
            description: enqueue message to redis
            uri: spring-redis
            parameters:
              host: localhosts
              port: "6379"
              command: RPUSH
              channels: camel:bill:in
